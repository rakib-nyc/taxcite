[project]
name = "taxcite"
version = "0.1.0"
description = "Retrieve U.S. federal tax law and verify citations and quotations in AI-drafted tax writing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Muhammad Rakibul Islam", email = "rakib.islam@rutgers.edu" }]
maintainers = [{ name = "Muhammad Rakibul Islam", email = "rakib.islam@rutgers.edu" }]
keywords = [
  "tax",
  "tax-law",
  "irc",
  "internal-revenue-code",
  "treasury-regulations",
  "ecfr",
  "citation-verification",
  "hallucination-detection",
  "legal-tech",
  "legaltech",
  "legal-research",
  "mcp",
  "model-context-protocol",
  "llm",
  "ai-safety",
  "rag",
  "courtlistener",
  "case-law",
  "quotation-checking",
  "citations",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.2",
  "lxml>=5.2",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "lxml-stubs>=0.5",
]

[project.urls]
Homepage = "https://rakib-nyc.github.io/taxcite/"
Documentation = "https://rakib-nyc.github.io/taxcite/"
Repository = "https://github.com/rakib-nyc/taxcite"
Issues = "https://github.com/rakib-nyc/taxcite/issues"

[project.scripts]
taxcite = "taxcite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxcite"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "ANN"]
# RUF001-003: legal text is full of section symbols, en dashes, and curly quotes; they
# are load-bearing here, not typos.
ignore = ["D203", "D213", "ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202"]
"evals/*" = ["D100", "D103", "ANN001", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: test requires live network access to government sources (deselected by default)",
]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint.isort]
known-first-party = ["taxcite"]
known-local-folder = ["conftest"]
